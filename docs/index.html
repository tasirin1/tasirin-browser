<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Browser — Smart TV / Android TV</title>
<style>
  /* ===== Variabel dark theme ===== */
  :root {
    color-scheme: dark;
    --sidebar: #14181d;
    --panel: #171b21;
    --card: #1c2129;
    --card-border: #2b323c;
    --hover-bg: #27303b;
    --bg: #0e1116;
    --text: #e8edf2;
    --sub: #93a0ad;
    --focus: #4fc3f7;
    --accent: #1e88e5;
    --trash: #0c0e11;
    --trash-border: #3b424d;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: clamp(16px, 1.05vw, 21px);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: none; cursor: pointer; }

  #app { height: 100vh; width: 100vw; }

  .view { display: none; width: 100%; height: 100%; }
  .view.active { display: flex; }

  /* ===== Highlight hover (saat cursor di atas elemen) ===== */
  .tile, .menu-item, .tbtn, .mrow, .btn, .btn-back, #searchButton, #address, .modal input {
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .hovered {
    box-shadow: 0 0 0 3px var(--focus), 0 18px 44px rgba(0, 0, 0, 0.55) !important;
    border-color: var(--focus) !important;
    transform: translateY(-3px) scale(1.02);
    background: var(--hover-bg) !important;
  }
  #searchButton.hovered { transform: scale(1.08); background: linear-gradient(135deg, #1976d2, #4fc3f7) !important; }
  .menu-item.hovered { background: rgba(79, 195, 247, 0.16) !important; color: #fff; transform: translateX(4px); }
  .tbtn.hovered { background: #262e38 !important; }
  .mrow.hovered { background: #262e38 !important; }

  /* ===== CURSOR ===== */
  #cursor {
    position: fixed;
    left: 0;
    top: 0;
    width: 36px;
    height: 36px;
    pointer-events: none;
    z-index: 9999;
    filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.6));
    transition: left 0.06s linear, top 0.06s linear;
  }
  #cursor svg { width: 100%; height: 100%; display: block; }
  #cursor.over-content { filter: drop-shadow(0 0 12px rgba(79, 195, 247, 0.9)) drop-shadow(0 3px 8px rgba(0, 0, 0, 0.6)); }

  /* ===== HOME ===== */
  #view-home { flex-direction: row; }

  #sidebar {
    width: 232px;
    flex: none;
    background: var(--sidebar);
    border-right: 1px solid var(--card-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 26px 14px 30px;
    gap: 30px;
  }
  #searchButton {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1565c0, #42a5f5);
    color: #fff;
    display: grid;
    place-items: center;
    border: 2px solid rgba(255, 255, 255, 0.18);
    flex: none;
  }
  #searchButton svg { width: 26px; height: 26px; }

  #sidebarMenu { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    color: #cfd5dd;
    border: 1px solid transparent;
    text-align: left;
  }
  .menu-item .mi-ico { width: 22px; height: 22px; opacity: 0.85; }
  .menu-item.active { background: rgba(79, 195, 247, 0.12); color: #fff; box-shadow: inset 3px 0 0 var(--focus); }

  #homeMain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #homeHeader { display: flex; justify-content: flex-end; padding: 26px 34px 6px; }
  #homeHeader h1 { font-size: clamp(1.5rem, 2vw, 2rem); font-weight: 800; letter-spacing: -0.02em; color: #f2f6fa; }

  #homeContent { flex: 1; overflow-y: auto; padding: 18px 34px 40px; max-width: 1560px; width: 100%; margin: 0 auto; }
  .home-section { display: none; }
  .home-section.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .grid-row { display: grid; gap: 18px; margin-bottom: 18px; }
  .row-3 { grid-template-columns: repeat(3, 1fr); }
  .row-4 { grid-template-columns: repeat(4, 1fr); }
  .col-1 { grid-column: 1 / 2; }

  .tile {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    width: 100%;
    color: var(--text);
    min-height: 92px;
  }
  .t-ico {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 1.35rem;
    flex: none;
    color: #fff;
  }
  .t-name { font-size: 1.12rem; font-weight: 700; }
  .t-sub { font-size: 0.88rem; color: var(--sub); margin-top: 3px; word-break: break-all; line-height: 1.3; }

  .engine-tile { flex-direction: column; align-items: flex-start; gap: 12px; min-height: 150px; padding: 22px; }
  .engine-tile .t-ico { border-radius: 50%; width: 58px; height: 58px; font-size: 1.5rem; }
  .g-ico { background: conic-gradient(from 210deg, #4285f4, #ea4335, #fbbc05, #34a853, #4285f4); }
  .d-ico { background: #de5833; }
  .b-ico { background: #2932e1; }

  .trash-tile { background: var(--trash); border-color: var(--trash-border); }
  .trash-tile .t-ico { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.14); }
  .trash-tile svg { width: 26px; height: 26px; stroke: #ff8a80; }
  .url-tile .t-ico { background: linear-gradient(135deg, #1e88e5, #42a5f5); }
  .settings-tile .t-ico { background: linear-gradient(135deg, #546e7a, #90a4ae); }
  .settings-tile svg { width: 26px; height: 26px; stroke: #fff; }

  .empty-panel {
    background: var(--card);
    border: 2px dashed var(--card-border);
    border-radius: var(--radius);
    padding: 60px 30px;
    text-align: center;
    color: var(--sub);
  }
  .empty-panel .ep-ico { font-size: 2.6rem; margin-bottom: 12px; }
  .empty-panel p { margin-bottom: 20px; }
  .btn-back {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 12px;
    background: #222a34;
    border: 1px solid var(--card-border);
    font-weight: 650;
    color: var(--text);
  }

  /* ===== BROWSER ===== */
  #view-browser { flex-direction: column; }

  #toolbar {
    height: 76px;
    background: var(--panel);
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    flex: none;
  }
  .tbtn {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: #cfd5dd;
    border: 1px solid transparent;
  }
  .tbtn svg { width: 24px; height: 24px; }
  .tbtn.disabled { opacity: 0.32; pointer-events: none; }
  .tbtn.active svg { fill: #f5b301; stroke: #c78700; }

  #address {
    flex: 1;
    min-width: 120px;
    height: 48px;
    padding: 0 18px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: #12161b;
    color: var(--text);
    outline: none;
  }
  #address:focus, #address.hovered { border-color: var(--focus); background: #171c22; }
  #address.hovered { box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.45); }

  #browserContent { position: relative; flex: 1; min-height: 0; background: #fff; overflow: hidden; }
  #browserFrame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #frameHint {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: rgba(24, 30, 38, 0.92);
    color: #fff;
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 0.9rem;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ===== MODAL ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: grid;
    place-items: center;
    z-index: 50;
  }
  .modal {
    background: #1a1f26;
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    min-width: 440px;
    max-width: 640px;
    width: 90%;
    padding: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    animation: fadeIn 0.2s ease;
  }
  .modal h2 { font-size: 1.3rem; margin-bottom: 16px; }
  .modal p.lead { color: var(--sub); font-size: 0.95rem; margin-bottom: 10px; }
  .mrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 20px;
    background: #14181d;
    border: 1px solid var(--card-border);
    border-radius: 14px;
    margin: 10px 0;
    text-align: left;
    width: 100%;
  }
  .mrow .k { font-weight: 650; }
  .mrow .v { color: var(--sub); }
  .modal input[data-role="search"] {
    width: 100%;
    padding: 15px 18px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: #12161b;
    outline: none;
    margin-bottom: 14px;
  }
  .modal input[data-role="search"]:focus, .modal input[data-role="search"].hovered { border-color: var(--focus); }
  .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 18px; }
  .btn {
    padding: 12px 26px;
    border-radius: 12px;
    font-weight: 650;
    border: 1px solid var(--card-border);
    background: #222a34;
    color: var(--text);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { background: #b3261e; border-color: #b3261e; color: #fff; }
  .tab-row { display: flex; align-items: center; gap: 14px; width: 100%; }
  .tab-dot { width: 40px; height: 40px; border-radius: 10px; background: #222a34; display: grid; place-items: center; flex: none; }

  /* ===== Toast ===== */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(24px);
    background: #262e38;
    border: 1px solid var(--card-border);
    color: #fff;
    padding: 13px 24px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 100;
    font-size: 0.95rem;
    max-width: 80vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== Responsive (TV ideal 1920x1080; tetap aman di layar kecil) ===== */
  @media (max-width: 1180px) {
    #sidebar { width: 200px; }
    .row-3, .row-4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    #view-home { flex-direction: column; }
    #sidebar { width: 100%; flex-direction: row; padding: 12px 14px; gap: 14px; }
    #sidebarMenu { flex-direction: row; gap: 6px; }
    .menu-item { padding: 10px; justify-content: center; }
    .menu-item .mi-label { display: none; }
    .row-3, .row-4 { grid-template-columns: 1fr; }
    #homeHeader h1 { font-size: 1.3rem; }
    #frameHint { display: none; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ HOME ============ -->
  <main id="view-home" class="view active">
    <aside id="sidebar" aria-label="Sidebar">
      <button id="searchButton" data-action="search-dialog" aria-label="Search"></button>
      <nav id="sidebarMenu">
        <button class="menu-item active" data-action="sidebar-item" data-section="engines">
          <svg class="mi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="mi-label">Search Engines</span>
        </button>
        <button class="menu-item" data-action="sidebar-item" data-section="bookmarks">
          <svg class="mi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21 12 17 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span class="mi-label">Bookmarks</span>
        </button>
        <button class="menu-item" data-action="sidebar-item" data-section="history">
          <svg class="mi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span class="mi-label">History</span>
        </button>
        <button class="menu-item" data-action="prefs">
          <svg class="mi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
          <span class="mi-label">Preferences</span>
        </button>
      </nav>
    </aside>

    <section id="homeMain">
      <header id="homeHeader"><h1>TV Browser</h1></header>
      <div id="homeContent">

        <!-- Section: Search Engines (default aktif) -->
        <section id="section-engines" class="home-section active">
          <div class="grid-row row-3">
            <button class="tile engine-tile" data-action="engine" data-engine="google">
              <span class="t-ico g-ico">G</span>
              <div><div class="t-name">Google</div><div class="t-sub">Search Engine</div></div>
            </button>
            <button class="tile engine-tile" data-action="engine" data-engine="duckduckgo">
              <span class="t-ico d-ico">D</span>
              <div><div class="t-name">DuckDuckGo</div><div class="t-sub">Search Engine</div></div>
            </button>
            <button class="tile engine-tile" data-action="engine" data-engine="baidu">
              <span class="t-ico b-ico">B</span>
              <div><div class="t-name">Baidu</div><div class="t-sub">Search Engine</div></div>
            </button>
          </div>

          <div class="grid-row row-4">
            <button class="tile trash-tile" data-action="trash" aria-label="Clear shortcuts">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
              </span>
              <div><div class="t-name">Clear shortcuts</div><div class="t-sub">Remove all tiles below</div></div>
            </button>
            <button class="tile url-tile" data-action="open-url" data-url="http://192.168.100.1/">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z"/></svg>
              </span>
              <div><div class="t-name">192.168.100.1</div><div class="t-sub">http://192.168.100.1/</div></div>
            </button>
            <button class="tile url-tile" data-action="open-url" data-url="http://barayacell.com">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z"/></svg>
              </span>
              <div><div class="t-name">barayacell.com</div><div class="t-sub">http://barayacell.com</div></div>
            </button>
            <button class="tile url-tile" data-action="open-url" data-url="https://fast.com/id/">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z"/></svg>
              </span>
              <div><div class="t-name">fast.com</div><div class="t-sub">https://fast.com/id/</div></div>
            </button>
          </div>

          <div class="grid-row row-4">
            <button class="tile settings-tile col-1" data-action="prefs">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
              </span>
              <div><div class="t-name">Settings</div><div class="t-sub">Preferences</div></div>
            </button>
          </div>
        </section>

        <!-- Section: Bookmarks -->
        <section id="section-bookmarks" class="home-section">
          <div class="empty-panel">
            <div class="ep-ico">⭐</div>
            <p>No bookmarks saved yet. Open a site and press the star in the toolbar.</p>
            <button class="btn-back" data-action="sidebar-item" data-section="engines">Back to Search Engines</button>
          </div>
        </section>

        <!-- Section: History -->
        <section id="section-history" class="home-section">
          <div class="empty-panel">
            <div class="ep-ico">🕘</div>
            <p>No browsing history yet.</p>
            <button class="btn-back" data-action="sidebar-item" data-section="engines">Back to Search Engines</button>
          </div>
        </section>

      </div>
    </section>
  </main>

  <!-- ============ BROWSER ============ -->
  <main id="view-browser" class="view">
    <header id="toolbar">
      <button class="tbtn" data-action="home" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      </button>
      <button class="tbtn" data-action="refresh" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M21 13a9 9 0 1 1-3-6.7L21 8"/></svg>
      </button>
      <button class="tbtn" data-action="go-back" aria-label="Back" title="Back" id="btnBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="tbtn" data-action="go-forward" aria-label="Forward" title="Forward" id="btnForward">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <input id="address" type="text" data-role="address" placeholder="Enter URL or search…" autocomplete="off" spellcheck="false">
      <button class="tbtn" data-action="bookmark" aria-label="Bookmark" title="Bookmark" id="btnBookmark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15.09 8.26 22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"/></svg>
      </button>
      <button class="tbtn" data-action="gear" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      </button>
      <button class="tbtn" data-action="newtab" aria-label="New Tab" title="New Tab" id="btnNewTab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></svg>
      </button>
    </header>

    <div id="browserContent">
      <iframe id="browserFrame" title="Website content"></iframe>
      <div id="frameHint">Cursor active — Arrow Keys to move, Enter to click, Backspace to go Home.</div>
    </div>
  </main>

</div>

<div id="cursor" aria-hidden="true">
  <svg viewBox="0 0 24 24">
    <path d="M4 4l7.07 17 2.51-7.39L21 11.07z" fill="#fff" stroke="#101418" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>
</div>

<div id="modalRoot"></div>
<div id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  /* ===== Konstanta ===== */
  var ENGINES = {
    google:     { label: 'Google',     home: 'https://www.google.com', search: 'https://www.google.com/search?q=' },
    duckduckgo: { label: 'DuckDuckGo', home: 'https://duckduckgo.com', search: 'https://duckduckgo.com/?q=' },
    baidu:      { label: 'Baidu',      home: 'https://www.baidu.com',  search: 'https://www.baidu.com/s?wd=' }
  };
  var CURSOR_STEP = 30;       // piksel per ketukan Arrow Key
  var CURSOR_SIZE = 36;
  var HOT_X = 17, HOT_Y = 30; // ujung panah pada sprite cursor

  /* ===== State ===== */
  var state = {
    view: 'home',
    history: [],
    histIdx: -1,
    defaultEngine: 'google',
    showTips: true,
    tabCount: 1,
    cursorX: 0,
    cursorY: 0
  };
  var hoveredEl = null;
  var modalEl = null;
  var toastTimer = null;
  var hoverTimer = null;

  /* ===== Helper ===== */
  function $(s, root) { return (root || document).querySelector(s); }
  function $all(s, root) { return Array.prototype.slice.call((root || document).querySelectorAll(s)); }

  function showToast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ===== CURSOR (Arrow Keys = remote TV) ===== */
  function cursorEl() { return $('#cursor'); }

  function initCursor() {
    state.cursorX = Math.round((window.innerWidth - CURSOR_SIZE) / 2);
    state.cursorY = Math.round((window.innerHeight - CURSOR_SIZE) / 2);
    applyCursor();
  }

  function applyCursor() {
    var c = cursorEl();
    c.style.left = state.cursorX + 'px';
    c.style.top = state.cursorY + 'px';
  }

  function moveCursor(dx, dy) {
    state.cursorX = Math.max(0, Math.min(state.cursorX + dx * CURSOR_STEP, window.innerWidth - CURSOR_SIZE));
    state.cursorY = Math.max(0, Math.min(state.cursorY + dy * CURSOR_STEP, window.innerHeight - CURSOR_SIZE));
    applyCursor();
  }

  function clampCursor() {
    state.cursorX = Math.max(0, Math.min(state.cursorX, window.innerWidth - CURSOR_SIZE));
    state.cursorY = Math.max(0, Math.min(state.cursorY, window.innerHeight - CURSOR_SIZE));
    applyCursor();
  }

  function pointerXY() {
    var r = cursorEl().getBoundingClientRect();
    return { x: r.left + HOT_X, y: r.top + HOT_Y };
  }

  // Highlight elemen yang berada di bawah cursor
  function updateHover() {
    if (!document.elementFromPoint) return;
    var p = pointerXY();
    var el = document.elementFromPoint(p.x, p.y);
    if (hoveredEl && hoveredEl !== el) hoveredEl.classList.remove('hovered');
    hoveredEl = null;
    var c = cursorEl();
    c.classList.remove('over-content');
    if (!el) return;
    if (el.tagName === 'IFRAME' || el.closest('iframe')) { c.classList.add('over-content'); return; }
    var target = el.closest('[data-action], input, button, a');
    if (target && target !== document.body) {
      hoveredEl = target;
      target.classList.add('hovered');
    }
  }

  // updateHover ditunda sebentar agar DOM sempat selesai berubah
  function scheduleHover() {
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(updateHover, 40);
  }

  // Klik pada posisi cursor (Enter = klik)
  function clickAtCursor() {
    if (!document.elementFromPoint) return;
    var p = pointerXY();
    var el = document.elementFromPoint(p.x, p.y);
    if (!el) return;
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      el.focus();
      if (el.id === 'address') showToast('Type a URL, then Enter. Press Esc to return to cursor.');
      return;
    }
    if (el.tagName === 'IFRAME' || el.closest('iframe')) {
      showToast('This site blocks embedding in the prototype.');
      return;
    }
    var actionable = el.closest('[data-action]');
    if (actionable) { handleAction(actionable); return; }
    if (el.closest('a')) { el.closest('a').click(); return; }
    if (el.tagName === 'BUTTON') { el.click(); }
  }

  /* ===== Navigasi antar view ===== */
  function showView(name) {
    state.view = name;
    closeModal();
    $all('.view').forEach(function (v) { v.classList.remove('active'); });
    $('#' + (name === 'home' ? 'view-home' : 'view-browser')).classList.add('active');
    if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
    clampCursor();
    scheduleHover();
  }

  function goHome() {
    showView('home');
    showToast('Back to Home');
  }

  function showBrowser() {
    showView('browser');
    updateNavButtons();
  }

  function openBrowser(url) {
    state.history = state.history.slice(0, state.histIdx + 1);
    state.history.push(url);
    state.histIdx = state.history.length - 1;
    if (!url) state.tabCount += 1;
    showBrowser();
    loadPage(url);
  }

  function loadPage(url) {
    var frame = $('#browserFrame');
    var addr = $('#address');
    var hint = $('#frameHint');
    if (!url) {
      frame.removeAttribute('src');
      addr.value = '';
      hint.style.display = 'block';
    } else {
      frame.src = url;
      addr.value = url;
      hint.style.display = state.showTips ? 'block' : 'none';
    }
    $('#btnBookmark').classList.remove('active');
    updateNavButtons();
  }

  function updateNavButtons() {
    $('#btnBack').classList.toggle('disabled', state.histIdx <= 0);
    $('#btnForward').classList.toggle('disabled', state.histIdx >= state.history.length - 1);
  }

  function refreshPage() {
    var frame = $('#browserFrame');
    if (frame.src) { frame.src = frame.src; showToast('Page refreshed'); }
  }

  function goBack() {
    if (state.histIdx > 0) { state.histIdx -= 1; loadPage(state.history[state.histIdx]); }
  }

  function goForward() {
    if (state.histIdx < state.history.length - 1) { state.histIdx += 1; loadPage(state.history[state.histIdx]); }
  }

  function toggleBookmark() {
    var b = $('#btnBookmark');
    b.classList.toggle('active');
    showToast(b.classList.contains('active') ? 'Bookmark added' : 'Bookmark removed');
  }

  function normalizeUrl(raw) {
    var v = (raw || '').trim();
    if (!v) return '';
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v)) return v;
    if (/\s/.test(v)) return null;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    return v;
  }

  function navigateFromAddress() {
    var inp = $('#address');
    var url = normalizeUrl(inp.value);
    inp.blur();
    scheduleHover();
    if (url === null) {
      openBrowser(ENGINES[state.defaultEngine].search + encodeURIComponent(inp.value.trim()));
    } else {
      openBrowser(url);
    }
  }

  function doSearchFromInput(inp) {
    var q = inp.value.trim();
    if (!q) { showToast('Type a query first'); return; }
    openBrowser(ENGINES[state.defaultEngine].search + encodeURIComponent(q));
  }

  /* ===== Home: pindah section sidebar ===== */
  function selectSection(name) {
    $all('.home-section').forEach(function (s) { s.classList.remove('active'); });
    var sec = $('#section-' + name);
    if (sec) sec.classList.add('active');
    $all('.menu-item').forEach(function (m) {
      m.classList.toggle('active', m.dataset.section === name);
    });
    scheduleHover();
  }

  function clearShortcuts() {
    $all('.url-tile').forEach(function (tile) { tile.remove(); });
    showToast('Shortcuts cleared');
  }

  /* ===== Modal ===== */
  function openModal(html, onOpen) {
    closeModal();
    var root = $('#modalRoot');
    root.innerHTML = '<div class="overlay"><div class="modal">' + html + '</div></div>';
    modalEl = $('.modal', root);
    if (onOpen) onOpen(modalEl);
    scheduleHover();
  }

  function closeModal() {
    if (modalEl) {
      modalEl = null;
      $('#modalRoot').innerHTML = '';
      if (hoveredEl) { hoveredEl.classList.remove('hovered'); hoveredEl = null; }
      scheduleHover();
    }
  }

  function modalRows(rows) {
    return rows.map(function (r) {
      return '<button class="mrow" data-action="' + r.action + '"><span class="k">' + r.k + '</span><span class="v">' + r.v + '</span></button>';
    }).join('');
  }

  function openSettings() {
    openModal(
      '<h2>Settings</h2>' +
      '<p class="lead">Move the cursor with Arrow Keys, Enter to select.</p>' +
      modalRows([
        { action: 'cycle-engine', k: 'Default search engine', v: ENGINES[state.defaultEngine].label + ' &middot; Enter to change' },
        { action: 'toggle-tips',  k: 'Show tips on browser page', v: state.showTips ? 'On' : 'Off' }
      ]) +
      '<div class="actions"><button class="btn primary" data-action="done">Done</button></div>'
    );
  }

  function cycleEngine() {
    var keys = Object.keys(ENGINES);
    var i = keys.indexOf(state.defaultEngine);
    state.defaultEngine = keys[(i + 1) % keys.length];
    showToast('Default search engine: ' + ENGINES[state.defaultEngine].label);
    openSettings();
  }

  function toggleTips() {
    state.showTips = !state.showTips;
    showToast(state.showTips ? 'Tips shown' : 'Tips hidden');
    openSettings();
  }

  function openSearchDialog() {
    openModal(
      '<h2>Search</h2>' +
      '<p class="lead">Search with ' + ENGINES[state.defaultEngine].label + ' (change it in Settings).</p>' +
      '<input type="text" data-role="search" placeholder="Type a query…">' +
      '<div class="actions"><button class="btn" data-action="close-modal">Cancel</button></div>',
      function (m) {
        var inp = $('input[data-role="search"]', m);
        setTimeout(function () { inp.focus(); }, 60);
        inp.addEventListener('input', function () {
          if (hoveredEl) { hoveredEl.classList.remove('hovered'); hoveredEl = null; }
        });
      }
    );
  }

  function openClearConfirm() {
    openModal(
      '<h2>Clear shortcuts</h2>' +
      '<p class="lead">Remove all site shortcut tiles from the home screen?</p>' +
      '<div class="actions">' +
      '<button class="btn" data-action="cancel">Cancel</button>' +
      '<button class="btn danger" data-action="clear">Clear</button>' +
      '</div>'
    );
  }

  function openTabs() {
    var current = $('#address').value || 'Blank';
    var host = current.replace(/^https?:\/\//, '').split('/')[0] || 'Blank';
    openModal(
      '<h2>Tabs (' + state.tabCount + ')</h2>' +
      modalRows([{ action: 'switch-tab', k: 'Tab 1', v: host }]) +
      '<div class="actions">' +
      '<button class="btn primary" data-action="open-tab">New Tab</button>' +
      '<button class="btn" data-action="close-modal">Cancel</button>' +
      '</div>'
    );
  }

  /* ===== Router aksi (Enter di cursor / klik mouse) ===== */
  function handleAction(btn) {
    if (!btn || !btn.dataset || !btn.dataset.action) return;
    var t = btn.dataset;
    switch (t.action) {
      case 'open-url':      openBrowser(t.url || ''); break;
      case 'engine':        openBrowser(ENGINES[t.engine].home); break;
      case 'search-dialog': openSearchDialog(); break;
      case 'sidebar-item':  selectSection(t.section); break;
      case 'prefs':         openSettings(); break;
      case 'trash':         openClearConfirm(); break;

      case 'home':          goHome(); break;
      case 'refresh':       refreshPage(); break;
      case 'go-back':       goBack(); break;
      case 'go-forward':    goForward(); break;
      case 'bookmark':      toggleBookmark(); break;
      case 'gear':          openSettings(); break;
      case 'newtab':        openTabs(); break;

      case 'open-tab':      closeModal(); openBrowser(''); break;
      case 'switch-tab':    closeModal(); break;
      case 'close-modal':   closeModal(); break;
      case 'cancel':        closeModal(); break;
      case 'clear':         clearShortcuts(); closeModal(); break;
      case 'done':          closeModal(); break;
      case 'cycle-engine':  cycleEngine(); break;
      case 'toggle-tips':   toggleTips(); break;
    }
    scheduleHover();
  }

  /* ===== Keyboard (simulasi remote TV) ===== */
  document.addEventListener('keydown', function (e) {
    var ae = document.activeElement;
    var isInput = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');

    // Mode mengetik di input: tetap dukung Enter / Esc / Backspace khusus
    if (isInput) {
      var inp = ae;
      if (e.key === 'Enter') {
        e.preventDefault();
        if (inp.dataset.role === 'address') navigateFromAddress();
        else if (inp.dataset.role === 'search') doSearchFromInput(inp);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        inp.blur();
        scheduleHover();
      } else if (e.key === 'Backspace' && !inp.value && inp.dataset.role === 'address') {
        e.preventDefault();
        inp.blur();
        goHome();
      }
      return;
    }

    // Cursor digerakkan Arrow Keys di SEMUA layar (Home + Browser + modal)
    if (e.key === 'ArrowUp') { e.preventDefault(); moveCursor(0, -1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); moveCursor(0, 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); moveCursor(-1, 0); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); moveCursor(1, 0); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); clickAtCursor(); }
    else if (e.key === 'Backspace') {
      e.preventDefault();
      if (modalEl) closeModal();
      else if (state.view === 'browser') goHome();
      else showToast('Already on Home');
    }
    else if (e.key === 'Escape') { if (modalEl) closeModal(); }
    else { return; }
    scheduleHover();
  });

  // Dukungan mouse tambahan (memudahkan testing di desktop)
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (t) handleAction(t);
  });

  window.addEventListener('load', function () {
    initCursor();
    updateHover();
  });

  window.addEventListener('resize', clampCursor);
})();
</script>
</body>
</html>
