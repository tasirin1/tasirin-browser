<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Browser — Prototype</title>
<style>
  /* ===== Variabel & reset ===== */
  :root {
    --sidebar-bg: #23272e;
    --sidebar-border: #33383f;
    --focus: #4fc3f7;
    --bg: #e9edf2;
    --card: #ffffff;
    --card-border: #d6dbe2;
    --text: #1b1f24;
    --sub: #5b6470;
    --trash: #12151a;
    --accent: #0f6cbd;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: clamp(15px, 1.05vw, 20px);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: none; cursor: pointer; }

  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  .view { display: none; flex: 1; min-height: 0; }
  .view.active { display: flex; }

  /* ===== Elemen focusable bersama ===== */
  .focusable { outline: none; }
  .focusable.focused,
  .focusable:focus-visible {
    position: relative;
    z-index: 2;
    box-shadow: 0 0 0 4px var(--focus), 0 14px 30px rgba(15, 40, 70, 0.28);
    border-color: var(--focus) !important;
    transform: translateY(-3px) scale(1.02);
    background: #ffffff !important;
  }
  .focusable { transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease; }

  /* ===== HOME ===== */
  #view-home { flex-direction: row; }

  #sidebar {
    width: 236px;
    flex: none;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 26px 14px 30px;
    gap: 30px;
  }
  #searchButton {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1565c0, #42a5f5);
    color: #fff;
    display: grid;
    place-items: center;
    border: 2px solid rgba(255, 255, 255, 0.18);
    flex: none;
  }
  #searchButton svg { width: 26px; height: 26px; }
  #searchButton.focused { transform: scale(1.06); box-shadow: 0 0 0 4px var(--focus), 0 10px 26px rgba(0, 0, 0, 0.5); }

  #sidebarMenu { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    color: #cfd5dd;
    border: 1px solid transparent;
    text-align: left;
    font-size: 1rem;
  }
  .menu-item .mi-ico { width: 22px; height: 22px; opacity: 0.85; }
  .menu-item.selected { background: rgba(255, 255, 255, 0.09); color: #fff; box-shadow: inset 3px 0 0 var(--focus); }
  .menu-item.focused { background: rgba(255, 255, 255, 0.16) !important; color: #fff; box-shadow: 0 0 0 3px var(--focus), inset 3px 0 0 var(--focus); transform: translateX(3px); }

  #homeMain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #homeHeader { display: flex; justify-content: flex-end; padding: 26px 34px 6px; }
  #homeHeader h1 { font-size: clamp(1.5rem, 2vw, 2rem); font-weight: 800; letter-spacing: -0.02em; color: #2a3138; }

  #homeContent { flex: 1; overflow-y: auto; padding: 18px 34px 40px; max-width: 1560px; width: 100%; margin: 0 auto; }
  .home-section { display: none; }
  .home-section.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .grid-row { display: grid; gap: 18px; margin-bottom: 18px; }
  .row-3 { grid-template-columns: repeat(3, 1fr); }
  .row-4 { grid-template-columns: repeat(4, 1fr); }
  .col-1 { grid-column: 1 / 2; }

  .tile {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    width: 100%;
    color: var(--text);
    min-height: 92px;
  }
  .t-ico {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 1.35rem;
    flex: none;
    color: #fff;
  }
  .t-name { font-size: 1.12rem; font-weight: 700; }
  .t-sub { font-size: 0.88rem; color: var(--sub); margin-top: 3px; word-break: break-all; line-height: 1.3; }

  .engine-tile { flex-direction: column; align-items: flex-start; gap: 12px; min-height: 150px; padding: 22px; }
  .engine-tile .t-ico { border-radius: 50%; width: 58px; height: 58px; font-size: 1.5rem; }
  .g-ico { background: conic-gradient(from 210deg, #4285f4, #ea4335, #fbbc05, #34a853, #4285f4); }
  .d-ico { background: #de5833; }
  .b-ico { background: #2932e1; }

  .trash-tile { background: var(--trash); border-color: #000; color: #fff; }
  .trash-tile .t-name { color: #fff; }
  .trash-tile .t-sub { color: #aab2bc; }
  .trash-tile .t-ico { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); }
  .trash-tile svg { width: 26px; height: 26px; stroke: #fff; }
  .trash-tile.focused { background: #1c2128 !important; }

  .url-tile .t-ico { background: linear-gradient(135deg, #0f6cbd, #42a5f5); }
  .settings-tile .t-ico { background: linear-gradient(135deg, #5b6470, #8a93a0); }
  .settings-tile svg { width: 26px; height: 26px; stroke: #fff; }

  .empty-panel {
    background: var(--card);
    border: 2px dashed var(--card-border);
    border-radius: var(--radius);
    padding: 60px 30px;
    text-align: center;
    color: var(--sub);
  }
  .empty-panel .ep-ico { font-size: 2.6rem; margin-bottom: 12px; }
  .empty-panel p { margin-bottom: 20px; }
  .empty-panel .btn-back {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 12px;
    background: #eef2f6;
    border: 1px solid var(--card-border);
    font-weight: 650;
  }

  /* ===== BROWSER ===== */
  #view-browser { flex-direction: column; }

  #toolbar {
    height: 78px;
    background: #fff;
    border-bottom: 1px solid #d9dee5;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    flex: none;
  }
  .tbtn {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: #2c333b;
    border: 1px solid transparent;
  }
  .tbtn svg { width: 24px; height: 24px; }
  .tbtn.focused { box-shadow: 0 0 0 3px var(--focus); background: #f2f6fb; transform: translateY(-2px); }
  .tbtn.disabled { opacity: 0.32; pointer-events: none; }
  .tbtn.active svg { fill: #f5b301; stroke: #c78700; }

  #address {
    flex: 1;
    min-width: 120px;
    height: 48px;
    padding: 0 18px;
    border-radius: 14px;
    border: 1px solid #dfe4ea;
    background: #f1f3f6;
    color: var(--text);
    outline: none;
  }
  #address:focus { border-color: var(--focus); background: #fff; box-shadow: 0 0 0 3px rgba(79, 195, 247, 0.35); }

  #browserContent { position: relative; flex: 1; min-height: 0; background: #fff; overflow: hidden; }
  #browserFrame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #frameHint {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: rgba(24, 30, 38, 0.9);
    color: #fff;
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 0.9rem;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  #cursor {
    position: absolute;
    left: 0;
    top: 0;
    width: 32px;
    height: 32px;
    pointer-events: none;
    z-index: 999;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
    transition: left 0.07s linear, top 0.07s linear;
  }
  #cursor svg { width: 100%; height: 100%; display: block; }

  /* ===== MODAL ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(12, 16, 22, 0.55);
    display: grid;
    place-items: center;
    z-index: 50;
  }
  .modal {
    background: #fff;
    border-radius: var(--radius);
    min-width: 440px;
    max-width: 640px;
    width: 90%;
    padding: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    animation: fadeIn 0.2s ease;
  }
  .modal h2 { font-size: 1.3rem; margin-bottom: 16px; }
  .modal p.lead { color: var(--sub); font-size: 0.95rem; margin-bottom: 10px; }
  .mrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 20px;
    background: #f4f6f9;
    border: 1px solid transparent;
    border-radius: 14px;
    margin: 10px 0;
    text-align: left;
    width: 100%;
  }
  .mrow .k { font-weight: 650; }
  .mrow .v { color: var(--sub); }
  .mrow.focused, .mrow:focus-visible { box-shadow: 0 0 0 3px var(--focus); border-color: var(--focus); }
  .modal input[data-role="search"] {
    width: 100%;
    padding: 15px 18px;
    border-radius: 14px;
    border: 1px solid #dfe4ea;
    background: #f1f3f6;
    outline: none;
    margin-bottom: 14px;
  }
  .modal input[data-role="search"]:focus { border-color: var(--focus); background: #fff; }
  .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 18px; }
  .btn {
    padding: 12px 26px;
    border-radius: 12px;
    font-weight: 650;
    border: 1px solid var(--card-border);
    background: #fff;
    color: var(--text);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { background: #c62828; border-color: #c62828; color: #fff; }
  .btn.focused { box-shadow: 0 0 0 3px var(--focus); transform: translateY(-2px); }

  .tab-row { display: flex; align-items: center; gap: 14px; width: 100%; }
  .tab-dot { width: 40px; height: 40px; border-radius: 10px; background: #eef2f6; display: grid; place-items: center; flex: none; }

  /* ===== Toast ===== */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(24px);
    background: #20262e;
    color: #fff;
    padding: 13px 24px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    z-index: 100;
    font-size: 0.95rem;
    max-width: 80vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== Responsive ===== */
  @media (max-width: 1180px) {
    #sidebar { width: 200px; }
    .row-3, .row-4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    #view-home { flex-direction: column; }
    #sidebar { width: 100%; flex-direction: row; padding: 12px 14px; gap: 14px; }
    #sidebarMenu { flex-direction: row; gap: 6px; }
    .menu-item { padding: 10px; justify-content: center; }
    .menu-item .mi-label { display: none; }
    .row-3, .row-4 { grid-template-columns: 1fr; }
    #homeHeader h1 { font-size: 1.3rem; }
    #frameHint { display: none; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ HOME ============ -->
  <main id="view-home" class="view active">
    <aside id="sidebar" aria-label="Sidebar">
      <button id="searchButton" class="focusable" data-action="search-dialog" aria-label="Search"></button>
      <nav id="sidebarMenu">
        <button class="menu-item focusable selected" data-action="sidebar-item" data-section="engines">
          <svg class="mi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="mi-label">Search Engines</span>
        </button>
        <button class="menu-item focusable" data-action="sidebar-item" data-section="bookmarks">
          <svg class="mi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21 12 17 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span class="mi-label">Bookmarks</span>
        </button>
        <button class="menu-item focusable" data-action="sidebar-item" data-section="history">
          <svg class="mi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span class="mi-label">History</span>
        </button>
        <button class="menu-item focusable" data-action="prefs">
          <svg class="mi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
          <span class="mi-label">Preferences</span>
        </button>
      </nav>
    </aside>

    <section id="homeMain">
      <header id="homeHeader"><h1>TV Browser</h1></header>
      <div id="homeContent">

        <!-- Section: Search Engines (aktif) -->
        <section id="section-engines" class="home-section active">
          <div class="grid-row row-3">
            <button class="tile engine-tile focusable" data-action="engine" data-engine="google">
              <span class="t-ico g-ico">G</span>
              <div><div class="t-name">Google</div><div class="t-sub">Search Engine</div></div>
            </button>
            <button class="tile engine-tile focusable" data-action="engine" data-engine="duckduckgo">
              <span class="t-ico d-ico">D</span>
              <div><div class="t-name">DuckDuckGo</div><div class="t-sub">Search Engine</div></div>
            </button>
            <button class="tile engine-tile focusable" data-action="engine" data-engine="baidu">
              <span class="t-ico b-ico">B</span>
              <div><div class="t-name">Baidu</div><div class="t-sub">Search Engine</div></div>
            </button>
          </div>

          <div class="grid-row row-4">
            <button class="tile trash-tile focusable" data-action="trash" aria-label="Clear shortcuts">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
              </span>
              <div><div class="t-name">Clear shortcuts</div><div class="t-sub">Remove all tiles below</div></div>
            </button>
            <button class="tile url-tile focusable" data-action="open-url" data-url="http://192.168.100.1/">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z"/></svg>
              </span>
              <div><div class="t-name">192.168.100.1</div><div class="t-sub">http://192.168.100.1/</div></div>
            </button>
            <button class="tile url-tile focusable" data-action="open-url" data-url="http://barayacell.com">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z"/></svg>
              </span>
              <div><div class="t-name">barayacell.com</div><div class="t-sub">http://barayacell.com</div></div>
            </button>
            <button class="tile url-tile focusable" data-action="open-url" data-url="https://fast.com/id/">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.6 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z"/></svg>
              </span>
              <div><div class="t-name">fast.com</div><div class="t-sub">https://fast.com/id/</div></div>
            </button>
          </div>

          <div class="grid-row row-4">
            <button class="tile settings-tile focusable col-1" data-action="prefs">
              <span class="t-ico">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
              </span>
              <div><div class="t-name">Settings</div><div class="t-sub">Preferences</div></div>
            </button>
          </div>
        </section>

        <!-- Section: Bookmarks -->
        <section id="section-bookmarks" class="home-section">
          <div class="empty-panel">
            <div class="ep-ico">⭐</div>
            <p>No bookmarks saved yet. Open a site and press the star in the toolbar.</p>
            <button class="btn-back focusable" data-action="sidebar-item" data-section="engines">Back to Search Engines</button>
          </div>
        </section>

        <!-- Section: History -->
        <section id="section-history" class="home-section">
          <div class="empty-panel">
            <div class="ep-ico">🕘</div>
            <p>No browsing history yet.</p>
            <button class="btn-back focusable" data-action="sidebar-item" data-section="engines">Back to Search Engines</button>
          </div>
        </section>

      </div>
    </section>
  </main>

  <!-- ============ BROWSER ============ -->
  <main id="view-browser" class="view">
    <header id="toolbar">
      <button class="tbtn focusable" data-action="home" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      </button>
      <button class="tbtn focusable" data-action="refresh" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M21 13a9 9 0 1 1-3-6.7L21 8"/></svg>
      </button>
      <button class="tbtn focusable" data-action="go-back" aria-label="Back" title="Back" id="btnBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="tbtn focusable" data-action="go-forward" aria-label="Forward" title="Forward" id="btnForward">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <input id="address" type="text" data-role="address" placeholder="Enter URL or search…" autocomplete="off" spellcheck="false">
      <button class="tbtn focusable" data-action="bookmark" aria-label="Bookmark" title="Bookmark" id="btnBookmark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15.09 8.26 22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"/></svg>
      </button>
      <button class="tbtn focusable" data-action="gear" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      </button>
      <button class="tbtn focusable" data-action="newtab" aria-label="New Tab" title="New Tab" id="btnNewTab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></svg>
      </button>
    </header>

    <div id="browserContent">
      <iframe id="browserFrame" title="Website content"></iframe>
      <div id="frameHint">Cursor active — Arrow keys to move, Enter to click, Backspace to go Home.</div>
      <div id="cursor">
        <svg viewBox="0 0 24 24">
          <path d="M4 4l7.07 17 2.51-7.39L21 11.07z" fill="#fff" stroke="#101418" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </main>

</div>

<div id="modalRoot"></div>
<div id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  /* ===== Konstanta ===== */
  var ENGINES = {
    google:     { label: 'Google',     home: 'https://www.google.com',      search: 'https://www.google.com/search?q=' },
    duckduckgo: { label: 'DuckDuckGo', home: 'https://duckduckgo.com',      search: 'https://duckduckgo.com/?q=' },
    baidu:      { label: 'Baidu',      home: 'https://www.baidu.com',       search: 'https://www.baidu.com/s?wd=' }
  };
  var CURSOR_STEP = 28;

  /* ===== State ===== */
  var state = {
    view: 'home',
    history: [],
    histIdx: -1,
    defaultEngine: 'google',
    showTips: true,
    tabCount: 1
  };
  var focusedEl = null;
  var modalEl = null;
  var toastTimer = null;

  /* ===== Helper ===== */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function focusables(scope) {
    return $all('.focusable', scope || document).filter(function (el) {
      if (el.classList.contains('disabled')) return false;
      var v = el.closest('.view');
      if (v && !v.classList.contains('active')) return false;
      var s = el.closest('.home-section');
      if (s && !s.classList.contains('active')) return false;
      return true;
    });
  }

  function showToast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ==== Fokus (navigasi D-pad / Arrow Keys) ==== */
  function setFocus(el) {
    if (!el) return;
    if (focusedEl) focusedEl.classList.remove('focused');
    focusedEl = el;
    el.classList.add('focused');
    try { el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (err) { /* abaikan di lingkungan tanpa layout */ }
  }

  function moveFocus(dx, dy) {
    var list = focusables(modalEl);
    if (list.length < 2) return;
    var cur = focusedEl;
    if (!cur) { setFocus(list[0]); return; }
    var curR = cur.getBoundingClientRect();
    var cx = curR.left + curR.width / 2;
    var cy = curR.top + curR.height / 2;
    var best = null, bestScore = Infinity;
    list.forEach(function (el) {
      if (el === cur) return;
      var r = el.getBoundingClientRect();
      var ex = r.left + r.width / 2;
      var ey = r.top + r.height / 2;
      var dxp = ex - cx, dyp = ey - cy;
      if (dx > 0 && dxp <= 0) return;
      if (dx < 0 && dxp >= 0) return;
      if (dy > 0 && dyp <= 0) return;
      if (dy < 0 && dyp >= 0) return;
      var parallel = Math.abs(dx) * Math.abs(dxp) + Math.abs(dy) * Math.abs(dyp);
      var perp = Math.abs(dx) * Math.abs(dyp) + Math.abs(dy) * Math.abs(dxp);
      var score = Math.hypot(dxp, dyp) + perp * 1.2;
      if (score < bestScore) { bestScore = score; best = el; }
    });
    if (best) setFocus(best);
  }

  function activate(el) {
    if (!el) return;
    var target = el.closest('[data-action]') || el;
    handleAction(target);
  }

  /* ===== Aksi utama (dipanggil oleh Enter & klik) ===== */
  function handleAction(btn) {
    if (!btn || !btn.dataset || !btn.dataset.action) return;
    var t = btn.dataset;
    switch (t.action) {
      case 'open-url':      openBrowser(t.url || ''); break;
      case 'engine':        openBrowser(ENGINES[t.engine].home); break;
      case 'search-dialog': openSearchDialog(); break;
      case 'sidebar-item':  selectSection(t.section); break;
      case 'prefs':         openSettings(); break;
      case 'trash':         openClearConfirm(); break;

      case 'home':          goHome(); break;
      case 'refresh':       refreshPage(); break;
      case 'go-back':       goBack(); break;
      case 'go-forward':    goForward(); break;
      case 'bookmark':      toggleBookmark(); break;
      case 'gear':          openSettings(); break;
      case 'newtab':        openTabs(); break;

      case 'open-tab':      closeModal(); openBrowser(''); break;
      case 'close-modal':   closeModal(); break;
      case 'cancel':        closeModal(); break;
      case 'clear':         clearShortcuts(); closeModal(); break;
      case 'done':          closeModal(); break;
      case 'cycle-engine':  cycleEngine(); break;
      case 'toggle-tips':   toggleTips(); break;
      case 'back-engines':  selectSection('engines'); break;
    }
  }

  /* ===== Navigasi Home ===== */
  function selectSection(name) {
    $all('.home-section').forEach(function (s) { s.classList.remove('active'); });
    var sec = $('#section-' + name);
    if (sec) sec.classList.add('active');
    $all('.menu-item').forEach(function (m) {
      m.classList.toggle('selected', m.dataset.section === name);
    });
    setFocus($('.menu-item.selected') || $('.home-section.active .focusable') || focusables()[0]);
  }

  function goHome() {
    if (document.activeElement && document.activeElement === $('#address')) $('#address').blur();
    closeModal();
    state.view = 'home';
    $('.view.active').classList.remove('active');
    $('#view-home').classList.add('active');
    setFocus($('.home-section.active .focusable') || $('.menu-item.selected') || focusables()[0]);
  }

  /* ===== Halaman Browser ===== */
  function showBrowser() {
    state.view = 'browser';
    $('.view.active').classList.remove('active');
    $('#view-browser').classList.add('active');
    if (document.activeElement) document.activeElement.blur();
    placeCursorCenter();
    setFocus(null);
    updateNavButtons();
  }

  function openBrowser(url) {
    state.history = state.history.slice(0, state.histIdx + 1);
    state.history.push(url);
    state.histIdx = state.history.length - 1;
    if (!url) state.tabCount += 1;
    showBrowser();
    loadPage(url);
  }

  function loadPage(url) {
    var frame = $('#browserFrame');
    var addr = $('#address');
    var hint = $('#frameHint');
    if (!url) {
      frame.removeAttribute('src');
      addr.value = '';
      hint.style.display = 'block';
    } else {
      frame.src = url;
      addr.value = url;
      if (!state.showTips) hint.style.display = 'none';
      else hint.style.display = 'block';
    }
    $('#btnBookmark').classList.remove('active');
    updateNavButtons();
  }

  function updateNavButtons() {
    var b = $('#btnBack'), f = $('#btnForward');
    b.classList.toggle('disabled', state.histIdx <= 0);
    f.classList.toggle('disabled', state.histIdx >= state.history.length - 1);
  }

  function refreshPage() {
    var frame = $('#browserFrame');
    if (frame.src) { frame.src = frame.src; showToast('Page refreshed'); }
  }

  function goBack() {
    if (state.histIdx > 0) { state.histIdx -= 1; loadPage(state.history[state.histIdx]); }
  }

  function goForward() {
    if (state.histIdx < state.history.length - 1) { state.histIdx += 1; loadPage(state.history[state.histIdx]); }
  }

  function toggleBookmark() {
    var b = $('#btnBookmark');
    b.classList.toggle('active');
    showToast(b.classList.contains('active') ? 'Bookmark added' : 'Bookmark removed');
  }

  function normalizeUrl(raw) {
    var v = (raw || '').trim();
    if (!v) return '';
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v)) return v;   // sudah punya skema
    if (/\s/.test(v)) return null;                        // ada spasi => pencarian
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    return v;
  }

  function navigateFromAddress() {
    var inp = $('#address');
    var url = normalizeUrl(inp.value);
    inp.blur();
    if (url === null) {
      var q = inp.value.trim();
      openBrowser(ENGINES[state.defaultEngine].search + encodeURIComponent(q));
    } else {
      openBrowser(url);
    }
  }

  function doSearchFromInput(inp) {
    var q = inp.value.trim();
    if (!q) return;
    openBrowser(ENGINES[state.defaultEngine].search + encodeURIComponent(q));
  }

  /* ===== Kursor on-screen ===== */
  function placeCursorCenter() {
    var zone = $('#browserContent');
    var c = $('#cursor');
    c.style.left = Math.max(0, (zone.clientWidth - c.offsetWidth) / 2) + 'px';
    c.style.top = Math.max(0, (zone.clientHeight - c.offsetHeight) / 2) + 'px';
  }

  function moveCursor(dx, dy) {
    var zone = $('#browserContent');
    var c = $('#cursor');
    var x = c.offsetLeft + dx * CURSOR_STEP;
    var y = c.offsetTop + dy * CURSOR_STEP;
    x = Math.max(0, Math.min(x, zone.clientWidth - c.offsetWidth));
    y = Math.max(0, Math.min(y, zone.clientHeight - c.offsetHeight));
    c.style.left = x + 'px';
    c.style.top = y + 'px';
  }

  function clickAtCursor() {
    if (!document.elementFromPoint) return;
    var c = $('#cursor').getBoundingClientRect();
    var x = c.left + 6, y = c.top + 6;
    var el = document.elementFromPoint(x, y);
    if (!el) return;
    if (el.tagName === 'IFRAME' || el.closest('iframe')) {
      showToast('This site blocks embedding in the prototype. Open it in the app instead.');
      return;
    }
    var actionable = el.closest('[data-action]');
    if (actionable) { handleAction(actionable); return; }
    el.click();
  }

  /* ===== Modal ===== */
  function openModal(html, onOpen) {
    closeModal();
    var root = $('#modalRoot');
    root.innerHTML = '<div class="overlay">' + html + '</div>';
    modalEl = $('.modal', root);
    if (onOpen) onOpen(modalEl);
    var first = focusables(modalEl)[0];
    if (first) { setFocus(first); if (first.tagName === 'INPUT') { first.focus(); setFocus(null); } }
  }

  function closeModal() {
    if (modalEl) {
      modalEl = null;
      $('#modalRoot').innerHTML = '';
    }
  }

  function modalRows(rows, extraHtml) {
    return rows.map(function (r) {
      return '<button class="mrow focusable" data-action="' + r.action + '"><span class="k">' + r.k + '</span><span class="v">' + r.v + '</span></button>';
    }).join('') + (extraHtml || '');
  }

  function openSettings() {
    openModal(
      '<div class="modal">' +
      '<h2>Settings</h2>' +
      '<p class="lead">Use Arrow keys to move, Enter to change.</p>' +
      modalRows([
        { action: 'cycle-engine', k: 'Default search engine', v: ENGINES[state.defaultEngine].label + ' &middot; Enter to change' },
        { action: 'toggle-tips',  k: 'Show tips on browser page', v: state.showTips ? 'On' : 'Off' }
      ]) +
      '<div class="actions"><button class="btn primary focusable" data-action="done">Done</button></div>' +
      '</div>'
    );
  }

  function cycleEngine() {
    var keys = Object.keys(ENGINES);
    var i = keys.indexOf(state.defaultEngine);
    state.defaultEngine = keys[(i + 1) % keys.length];
    showToast('Default search engine: ' + ENGINES[state.defaultEngine].label);
    openSettings();
  }

  function toggleTips() {
    state.showTips = !state.showTips;
    showToast(state.showTips ? 'Tips shown' : 'Tips hidden');
    openSettings();
  }

  function openSearchDialog() {
    openModal(
      '<div class="modal">' +
      '<h2>Search</h2>' +
      '<p class="lead">Search with ' + ENGINES[state.defaultEngine].label + ' (change it in Settings).</p>' +
      '<input type="text" data-role="search" placeholder="Type a query…">' +
      '<div class="actions"><button class="btn focusable" data-action="close-modal">Cancel</button></div>' +
      '</div>',
      function (m) {
        var inp = $('input[data-role="search"]', m);
        setTimeout(function () { inp.focus(); }, 40);
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); doSearchFromInput(inp); }
        });
        inp.addEventListener('input', function () { if (focusedEl) focusedEl.classList.remove('focused'); focusedEl = null; });
      }
    );
  }

  function openClearConfirm() {
    openModal(
      '<div class="modal">' +
      '<h2>Clear shortcuts</h2>' +
      '<p class="lead">Remove all site shortcut tiles from the home screen?</p>' +
      '<div class="actions">' +
      '<button class="btn focusable" data-action="cancel">Cancel</button>' +
      '<button class="btn danger focusable" data-action="clear">Clear</button>' +
      '</div>' +
      '</div>'
    );
  }

  function clearShortcuts() {
    $all('.url-tile').forEach(function (tile) { tile.remove(); });
    showToast('Shortcuts cleared');
  }

  function openTabs() {
    var current = $('#address').value || 'Blank';
    var host = current.replace(/^https?:\/\//, '').split('/')[0] || 'Blank';
    openModal(
      '<div class="modal">' +
      '<h2>Tabs (' + state.tabCount + ')</h2>' +
      modalRows([{ action: 'open-tab', k: 'Tab 1', v: host }]) +
      '<div class="actions"><button class="btn primary focusable" data-action="open-tab">New Tab</button>' +
      '<button class="btn focusable" data-action="close-modal">Cancel</button></div>' +
      '</div>'
    );
  }

  /* ===== Keyboard (simulasi remote) ===== */
  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement ? document.activeElement.tagName : '';
    var isInput = tag === 'INPUT' || tag === 'TEXTAREA';

    // Mode mengetik pada input — biarkan perilaku default, kecuali Enter/Backspace khusus
    if (isInput) {
      var inp = document.activeElement;
      if (e.key === 'Enter') {
        e.preventDefault();
        if (inp.dataset.role === 'address') navigateFromAddress();
        else if (inp.dataset.role === 'search') doSearchFromInput(inp);
      } else if (e.key === 'Backspace' && !inp.value && inp.dataset.role === 'address') {
        e.preventDefault();
        inp.blur();
        goHome();
      }
      return;
    }

    // Modal terbuka: arahkan fokus di dalam modal
    if (modalEl) {
      if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(0, -1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(0, 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); moveFocus(-1, 0); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); moveFocus(1, 0); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(focusedEl); }
      else if (e.key === 'Backspace' || e.key === 'Escape') { e.preventDefault(); closeModal(); }
      return;
    }

    if (state.view === 'home') {
      if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(0, -1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(0, 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); moveFocus(-1, 0); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); moveFocus(1, 0); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(focusedEl); }
      else if (e.key === 'Backspace') { e.preventDefault(); showToast('Already on Home'); }
    } else {
      // Halaman Browser: panah menggerakkan kursor
      if (e.key === 'ArrowUp') { e.preventDefault(); moveCursor(0, -1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); moveCursor(0, 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); moveCursor(-1, 0); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); moveCursor(1, 0); }
      else if (e.key === 'Enter') { e.preventDefault(); clickAtCursor(); }
      else if (e.key === ' ') { e.preventDefault(); clickAtCursor(); }
      else if (e.key === 'Backspace') { e.preventDefault(); goHome(); }
    }
  });

  // Klik mouse juga mendukung (memudahkan testing di desktop)
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (t) handleAction(t);
  });

  // Pastikan state awal fokus ada di Home
  window.addEventListener('load', function () {
    setFocus($('.home-section.active .focusable') || $('.menu-item.selected') || focusables()[0]);
  });
})();
</script>
</body>
</html>
